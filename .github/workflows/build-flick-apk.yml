name: Build FUTO Flick Typing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - flick-font-size-test
    paths:
      - "java/src/**"
      - "java/res/values/strings.xml"
      - ".github/workflows/build-flick-apk.yml"
      - "build.gradle"
      - "gradle/**"
      - "native/**"
      - "voiceinput-shared/**"

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and required submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "ndk;28.2.13676358" \
                     "cmake;3.22.1"

      - name: Build custom FUTO keyboard
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleUnstableDebug
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: FUTO-flick-${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-flick-typing-apk
          path: build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
